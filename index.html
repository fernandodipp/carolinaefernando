  <meta property="og:image" content="assets/compartilhar.jpg">

  <script>document.documentElement.classList.add("js");</script>
</head>
<body>

  <div class="fundo" aria-hidden="true"></div>
  <div class="luzes" aria-hidden="true"><span></span><span></span><span></span></div>
  <canvas class="brilhos" aria-hidden="true"></canvas>

  <main class="palco">

    <p class="chamada">Você recebeu um convite</p>

    <div class="cena">
      <!-- Parte de trás do envelope -->
      <div class="env env-costas" aria-hidden="true"></div>

      <!-- Convite -->
      <article class="convite" aria-label="Convite de casamento de Carolina e Fernando">
        <div class="convite-conteudo">
          <p class="texto t-chamada" style="--i:0">Vamos nos casar!</p>
          <div class="texto t-nomes" style="--i:1">
            <h1>Carolina e Fernando</h1>
            <p class="t-data">20 . 03 . 2027</p>
            <p class="t-contagem" data-contagem>&nbsp;</p>
          </div>
          <nav class="texto t-links" style="--i:2" aria-label="Links do casamento">
            <a class="link link-destaque" href="https://www.carolinaefernando.com.br/pages/38839921">Confirmar presença</a>
            <a class="link" href="https://www.carolinaefernando.com.br/pages/39036805">Lista de presentes</a>
            <a class="link" href="https://www.carolinaefernando.com.br/">Nosso site</a>
          </nav>
        </div>
      </article>

      <!-- Frente do envelope -->
      <div class="env env-bolso" aria-hidden="true">
        <p class="env-para">para você, com carinho</p>
      </div>
      <div class="env env-aba" aria-hidden="true"></div>
      <button class="selo" type="button" aria-label="Abrir o envelope">
        <img src="assets/monograma.png" alt="">
      </button>
    </div>

    <p class="dica">Toque no selo para abrir</p>
  </main>

  <script src="assets/main.js"></script>

</html>
